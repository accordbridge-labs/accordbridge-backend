name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accordbridge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: accordbridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accordbridge -d accordbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://accordbridge:ci-only-password@127.0.0.1:5432/accordbridge_test
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/*.test.js
      - name: Verify generated API contract
        run: |
          npm run docs:api
          git diff --exit-code -- docs/openapi.json
